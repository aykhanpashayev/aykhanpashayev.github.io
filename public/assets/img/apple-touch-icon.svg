<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="180" height="180" fill="#0b1220"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="160" height="160" fill="none" stroke="#2a3550" stroke-width="4"/>
  <rect x="14" y="14" width="152" height="152" fill="none" stroke="#1a2744" stroke-width="2"/>

  <!-- Cloud (blue) - left side -->
  <rect x="35" y="60" width="50" height="35" fill="#1a2744" stroke="#5aa7ff" stroke-width="4"/>
  <rect x="45" y="45" width="30" height="20" fill="#1a2744" stroke="#5aa7ff" stroke-width="4"/>
  <rect x="65" y="52" width="30" height="28" fill="#1a2744" stroke="#5aa7ff" stroke-width="4"/>
  <!-- Cloud inner glow -->
  <rect x="50" y="65" width="25" height="20" fill="#5aa7ff" opacity="0.15"/>

  <!-- Shield (amber) - right side -->
  <rect x="105" y="55" width="35" height="50" fill="#1a2744" stroke="#ffb35c" stroke-width="4"/>
  <rect x="110" y="60" width="25" height="40" fill="#ffb35c" opacity="0.2"/>
  <!-- Shield center line -->
  <line x1="122" y1="65" x2="122" y2="95" stroke="#ffb35c" stroke-width="3"/>

  <!-- Circuit/AI node (teal) - bottom center -->
  <rect x="75" y="115" width="30" height="30" fill="#1a2744" stroke="#4ecdc4" stroke-width="4"/>
  <rect x="85" y="125" width="10" height="10" fill="#4ecdc4" opacity="0.4"/>
  <!-- Circuit lines -->
  <line x1="90" y1="110" x2="90" y2="115" stroke="#4ecdc4" stroke-width="3"/>
  <line x1="90" y1="145" x2="90" y2="150" stroke="#4ecdc4" stroke-width="3"/>
  <line x1="70" y1="130" x2="75" y2="130" stroke="#4ecdc4" stroke-width="3"/>
  <line x1="105" y1="130" x2="110" y2="130" stroke="#4ecdc4" stroke-width="3"/>

  <!-- Corner pixel decorations -->
  <rect x="20" y="20" width="6" height="6" fill="#ffb35c" opacity="0.5"/>
  <rect x="154" y="20" width="6" height="6" fill="#5aa7ff" opacity="0.5"/>
  <rect x="20" y="154" width="6" height="6" fill="#4ecdc4" opacity="0.5"/>
  <rect x="154" y="154" width="6" height="6" fill="#ffb35c" opacity="0.5"/>
</svg>
