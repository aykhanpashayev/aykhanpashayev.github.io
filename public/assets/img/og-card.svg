<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1220"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2744" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative pixel border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#2a3550" stroke-width="3"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1a2744" stroke-width="1"/>

  <!-- Amber accent line (top) -->
  <rect x="40" y="40" width="400" height="4" fill="#ffb35c"/>

  <!-- Cloud icon (pixel art style) -->
  <g transform="translate(80, 100)">
    <!-- Cloud body -->
    <rect x="0" y="40" width="120" height="60" fill="#1a2744" stroke="#5aa7ff" stroke-width="3"/>
    <rect x="20" y="20" width="60" height="40" fill="#1a2744" stroke="#5aa7ff" stroke-width="3"/>
    <rect x="60" y="30" width="50" height="50" fill="#1a2744" stroke="#5aa7ff" stroke-width="3"/>
    <!-- Inner detail -->
    <rect x="40" y="50" width="40" height="30" fill="#5aa7ff" opacity="0.2"/>
  </g>

  <!-- Shield icon (security) -->
  <g transform="translate(220, 110)">
    <rect x="0" y="0" width="50" height="70" fill="#1a2744" stroke="#ffb35c" stroke-width="3"/>
    <rect x="5" y="5" width="40" height="60" fill="#ffb35c" opacity="0.15"/>
    <!-- Shield center line -->
    <line x1="25" y1="10" x2="25" y2="65" stroke="#ffb35c" stroke-width="2"/>
  </g>

  <!-- Circuit/AI icon -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="50" height="50" fill="#1a2744" stroke="#4ecdc4" stroke-width="3"/>
    <rect x="15" y="15" width="20" height="20" fill="#4ecdc4" opacity="0.5"/>
    <line x1="25" y1="0" x2="25" y2="15" stroke="#4ecdc4" stroke-width="2"/>
    <line x1="25" y1="35" x2="25" y2="50" stroke="#4ecdc4" stroke-width="2"/>
    <line x1="0" y1="25" x2="15" y2="25" stroke="#4ecdc4" stroke-width="2"/>
    <line x1="35" y1="25" x2="50" y2="25" stroke="#4ecdc4" stroke-width="2"/>
  </g>

  <!-- Main name -->
  <text x="80" y="280" fill="#e9eef7" font-family="monospace" font-size="72" font-weight="bold">Aykhan Pashayev</text>

  <!-- Title with amber accent -->
  <text x="80" y="360" fill="#ffb35c" font-family="monospace" font-size="36">Cloud Security Engineer</text>

  <!-- Tagline -->
  <text x="80" y="420" fill="#a3b0c9" font-family="monospace" font-size="22">IAM Threat Detection · Automated Response · AI-Assisted Security</text>

  <!-- Decorative pixel blocks (right side) -->
  <g opacity="0.4">
    <!-- AWS-style blocks -->
    <rect x="900" y="150" width="60" height="60" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
    <rect x="970" y="150" width="60" height="60" fill="#1a2744" stroke="#5aa7ff" stroke-width="2"/>
    <rect x="900" y="220" width="60" height="60" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
    <rect x="970" y="220" width="60" height="60" fill="#1a2744" stroke="#ff6b6b" stroke-width="2"/>

    <!-- Smaller accent blocks -->
    <rect x="1050" y="180" width="40" height="40" fill="#ffb35c" opacity="0.2"/>
    <rect x="1050" y="230" width="40" height="40" fill="#5aa7ff" opacity="0.2"/>
    <rect x="1100" y="200" width="30" height="30" fill="#4ecdc4" opacity="0.2"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="40" y="550" width="200" height="3" fill="#ffb35c"/>

  <!-- URL at bottom -->
  <text x="1160" y="590" text-anchor="end" fill="#4a5568" font-family="monospace" font-size="16">aykhanpashayev.github.io</text>

  <!-- Small pixel decoration corners -->
  <g fill="#ffb35c">
    <rect x="40" y="550" width="4" height="4"/>
    <rect x="48" y="550" width="4" height="4"/>
    <rect x="56" y="550" width="4" height="4"/>
  </g>
</svg>
