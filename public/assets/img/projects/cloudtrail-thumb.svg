<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="400" height="240" fill="#0b1220"/>

  <!-- Grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#1a2744" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#1a2744" stroke-width="1"/>

  <!-- CloudTrail log stream (left) -->
  <rect x="16" y="30" width="110" height="160" fill="#0d1a2e" stroke="#5aa7ff" stroke-width="2"/>
  <text x="22" y="44" font-family="monospace" font-size="7" fill="#5aa7ff" opacity="0.8">CloudTrail Logs</text>
  <line x1="16" y1="48" x2="126" y2="48" stroke="#5aa7ff" stroke-width="1" opacity="0.4"/>

  <!-- Log entries -->
  <rect x="22" y="54" width="6" height="6" fill="#4ecdc4" opacity="0.8"/>
  <text x="32" y="60" font-family="monospace" font-size="6" fill="#888">ConsoleLogin</text>
  <rect x="22" y="64" width="6" height="6" fill="#888" opacity="0.5"/>
  <text x="32" y="70" font-family="monospace" font-size="6" fill="#555">DescribeInstances</text>
  <rect x="22" y="74" width="6" height="6" fill="#ff4d4d" opacity="0.9"/>
  <text x="32" y="80" font-family="monospace" font-size="6" fill="#ff4d4d">ConsoleLogin FAIL</text>
  <rect x="22" y="84" width="6" height="6" fill="#888" opacity="0.5"/>
  <text x="32" y="90" font-family="monospace" font-size="6" fill="#555">GetObject</text>
  <rect x="22" y="94" width="6" height="6" fill="#ff4d4d" opacity="0.9"/>
  <text x="32" y="100" font-family="monospace" font-size="6" fill="#ff4d4d">ConsoleLogin FAIL</text>
  <rect x="22" y="104" width="6" height="6" fill="#ffb35c" opacity="0.9"/>
  <text x="32" y="110" font-family="monospace" font-size="6" fill="#ffb35c">UpdateLoginProfile</text>
  <rect x="22" y="114" width="6" height="6" fill="#888" opacity="0.5"/>
  <text x="32" y="120" font-family="monospace" font-size="6" fill="#555">ListBuckets</text>
  <rect x="22" y="124" width="6" height="6" fill="#ff4d4d" opacity="0.9"/>
  <text x="32" y="130" font-family="monospace" font-size="6" fill="#ff4d4d">ConsoleLogin FAIL</text>
  <rect x="22" y="134" width="6" height="6" fill="#ffb35c" opacity="0.9"/>
  <text x="32" y="140" font-family="monospace" font-size="6" fill="#ffb35c">DeleteMFADevice</text>
  <rect x="22" y="144" width="6" height="6" fill="#888" opacity="0.5"/>
  <text x="32" y="150" font-family="monospace" font-size="6" fill="#555">PutBucketPolicy</text>
  <rect x="22" y="154" width="6" height="6" fill="#ff4d4d" opacity="0.9"/>
  <text x="32" y="160" font-family="monospace" font-size="6" fill="#ff4d4d">AttachUserPolicy</text>
  <rect x="22" y="164" width="6" height="6" fill="#888" opacity="0.5"/>
  <text x="32" y="170" font-family="monospace" font-size="6" fill="#555">DescribeVpcs</text>
  <rect x="22" y="174" width="6" height="6" fill="#ffb35c" opacity="0.9"/>
  <text x="32" y="180" font-family="monospace" font-size="6" fill="#ffb35c">CreateAccessKey</text>

  <!-- EventBridge filter (center) -->
  <rect x="148" y="70" width="80" height="100" fill="#0d1a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="154" y="84" font-family="monospace" font-size="7" fill="#a78bfa">EventBridge</text>
  <line x1="148" y1="88" x2="228" y2="88" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <!-- Filter funnel pixel -->
  <rect x="158" y="96" width="60" height="6" fill="#a78bfa" opacity="0.6"/>
  <rect x="162" y="102" width="52" height="6" fill="#a78bfa" opacity="0.5"/>
  <rect x="168" y="108" width="40" height="6" fill="#a78bfa" opacity="0.4"/>
  <rect x="174" y="114" width="28" height="6" fill="#a78bfa" opacity="0.5"/>
  <rect x="180" y="120" width="16" height="6" fill="#a78bfa" opacity="0.6"/>
  <rect x="184" y="126" width="8" height="6" fill="#a78bfa" opacity="0.7"/>
  <!-- Filter label -->
  <text x="154" y="148" font-family="monospace" font-size="6" fill="#a78bfa">40+ API rules</text>
  <text x="154" y="158" font-family="monospace" font-size="6" fill="#a78bfa">signal filter</text>

  <!-- Flow arrows: logs → eventbridge -->
  <rect x="128" y="116" width="6" height="4" fill="#5aa7ff" opacity="0.8"/>
  <rect x="134" y="116" width="6" height="4" fill="#5aa7ff" opacity="0.7"/>
  <rect x="140" y="116" width="6" height="4" fill="#5aa7ff" opacity="0.6"/>
  <!-- Arrowhead -->
  <rect x="144" y="112" width="4" height="4" fill="#5aa7ff"/>
  <rect x="144" y="120" width="4" height="4" fill="#5aa7ff"/>

  <!-- CloudWatch alarm (right) -->
  <rect x="252" y="50" width="80" height="60" fill="#0d1a2e" stroke="#ffb35c" stroke-width="2"/>
  <text x="258" y="64" font-family="monospace" font-size="7" fill="#ffb35c">CloudWatch</text>
  <line x1="252" y1="68" x2="332" y2="68" stroke="#ffb35c" stroke-width="1" opacity="0.4"/>
  <!-- Alarm threshold line -->
  <line x1="258" y1="90" x2="326" y2="90" stroke="#ff4d4d" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Metric bars -->
  <rect x="260" y="96" width="6" height="4" fill="#5aa7ff" opacity="0.6"/>
  <rect x="268" y="92" width="6" height="8" fill="#5aa7ff" opacity="0.6"/>
  <rect x="276" y="94" width="6" height="6" fill="#5aa7ff" opacity="0.6"/>
  <rect x="284" y="80" width="6" height="20" fill="#ff4d4d" opacity="0.9"/>
  <rect x="292" y="88" width="6" height="12" fill="#ffb35c" opacity="0.8"/>
  <rect x="300" y="94" width="6" height="6" fill="#5aa7ff" opacity="0.6"/>
  <rect x="308" y="96" width="6" height="4" fill="#5aa7ff" opacity="0.5"/>
  <rect x="316" y="92" width="6" height="8" fill="#5aa7ff" opacity="0.5"/>

  <!-- SNS alert (bottom right) -->
  <rect x="252" y="130" width="80" height="60" fill="#0d1a2e" stroke="#ff4d4d" stroke-width="2"/>
  <text x="258" y="144" font-family="monospace" font-size="7" fill="#ff4d4d">SNS ALERT</text>
  <line x1="252" y1="148" x2="332" y2="148" stroke="#ff4d4d" stroke-width="1" opacity="0.4"/>
  <!-- Alert icon -->
  <rect x="282" y="154" width="16" height="4" fill="#ff4d4d"/>
  <rect x="278" y="158" width="24" height="4" fill="#ff4d4d"/>
  <rect x="276" y="162" width="28" height="4" fill="#ff4d4d"/>
  <rect x="276" y="166" width="28" height="4" fill="#ff4d4d"/>
  <rect x="282" y="170" width="16" height="4" fill="#ff4d4d"/>
  <rect x="286" y="174" width="8" height="4" fill="#ff4d4d"/>
  <text x="258" y="186" font-family="monospace" font-size="6" fill="#ff4d4d">failed login × 3</text>

  <!-- Flow arrows: eventbridge → cloudwatch -->
  <rect x="232" y="76" width="6" height="4" fill="#a78bfa" opacity="0.8"/>
  <rect x="238" y="76" width="6" height="4" fill="#a78bfa" opacity="0.7"/>
  <rect x="244" y="76" width="6" height="4" fill="#a78bfa" opacity="0.6"/>
  <rect x="248" y="72" width="4" height="4" fill="#a78bfa"/>
  <rect x="248" y="80" width="4" height="4" fill="#a78bfa"/>

  <!-- Flow arrows: cloudwatch → sns -->
  <rect x="290" y="112" width="4" height="6" fill="#ffb35c" opacity="0.8"/>
  <rect x="290" y="118" width="4" height="6" fill="#ffb35c" opacity="0.7"/>
  <rect x="290" y="124" width="4" height="6" fill="#ffb35c" opacity="0.6"/>
  <rect x="286" y="128" width="4" height="4" fill="#ffb35c"/>
  <rect x="294" y="128" width="4" height="4" fill="#ffb35c"/>

  <!-- Labels -->
  <text x="12" y="220" font-family="monospace" font-size="11" fill="#5aa7ff" opacity="0.9">CLOUDTRAIL MONITOR</text>
  <text x="12" y="234" font-family="monospace" font-size="9" fill="#4ecdc4" opacity="0.7">EVENT-DRIVEN ALERTING</text>

  <!-- Metric chip -->
  <rect x="270" y="200" width="118" height="18" fill="#1a2744" stroke="#5aa7ff" stroke-width="1"/>
  <text x="276" y="213" font-family="monospace" font-size="9" fill="#5aa7ff">40+ APIs  &lt;1min latency</text>

  <!-- Scanlines -->
  <rect width="400" height="240" fill="url(#scan4)" opacity="0.04"/>
  <defs>
    <pattern id="scan4" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#fff"/>
    </pattern>
  </defs>
</svg>
