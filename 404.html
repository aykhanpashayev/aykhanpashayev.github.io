<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found | Aykhan Pashayev</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32x32.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/pixel-ui.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
      font-family: monospace;
    }
    .not-found-msg {
      color: var(--muted);
      font-size: var(--text-lg);
      max-width: 40ch;
    }
  </style>
</head>
<body>
  <main class="not-found" role="main">
    <p class="not-found-code">404</p>
    <p class="not-found-msg">This page doesn't exist. Might've been moved or never deployed.</p>
    <a class="btn btn--primary" href="/">Back to home</a>
  </main>
</body>
</html>
