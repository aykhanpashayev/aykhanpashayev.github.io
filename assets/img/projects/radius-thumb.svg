<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="400" height="240" fill="#0b1220"/>

  <!-- Grid lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#1a2744" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#1a2744" stroke-width="1"/>

  <!-- Radar rings centered at 200,130 -->
  <rect x="160" y="90" width="80" height="80" fill="none" stroke="#5aa7ff" stroke-width="2" opacity="0.15"/>
  <rect x="140" y="70" width="120" height="120" fill="none" stroke="#5aa7ff" stroke-width="2" opacity="0.10"/>
  <rect x="120" y="50" width="160" height="160" fill="none" stroke="#5aa7ff" stroke-width="2" opacity="0.06"/>

  <!-- Radar sweep (pixel arc approximation) -->
  <rect x="200" y="90" width="60" height="8" fill="#5aa7ff" opacity="0.25"/>
  <rect x="200" y="98" width="50" height="8" fill="#5aa7ff" opacity="0.18"/>
  <rect x="200" y="106" width="36" height="8" fill="#5aa7ff" opacity="0.12"/>
  <rect x="200" y="114" width="20" height="8" fill="#5aa7ff" opacity="0.07"/>

  <!-- Center shield (pixel) -->
  <rect x="184" y="110" width="32" height="40" fill="#1a2744" stroke="#5aa7ff" stroke-width="2"/>
  <rect x="188" y="114" width="24" height="28" fill="#5aa7ff" opacity="0.2"/>
  <!-- Shield notch top -->
  <rect x="192" y="108" width="16" height="6" fill="#1a2744" stroke="#5aa7ff" stroke-width="2"/>
  <!-- Shield check mark -->
  <rect x="190" y="126" width="4" height="4" fill="#5aa7ff"/>
  <rect x="194" y="130" width="4" height="4" fill="#5aa7ff"/>
  <rect x="198" y="122" width="4" height="4" fill="#5aa7ff"/>
  <rect x="202" y="118" width="4" height="4" fill="#5aa7ff"/>
  <rect x="206" y="122" width="4" height="4" fill="#5aa7ff"/>

  <!-- Blast radius pulse dots -->
  <rect x="148" y="128" width="6" height="6" fill="#ff4d4d" opacity="0.9"/>
  <rect x="246" y="96" width="6" height="6" fill="#ff4d4d" opacity="0.7"/>
  <rect x="220" y="158" width="6" height="6" fill="#ffb35c" opacity="0.8"/>
  <rect x="162" y="80" width="6" height="6" fill="#ffb35c" opacity="0.6"/>

  <!-- Threat node (top-left) with X -->
  <rect x="60" y="50" width="28" height="28" fill="#1a2744" stroke="#ff4d4d" stroke-width="2"/>
  <rect x="64" y="54" width="4" height="4" fill="#ff4d4d"/>
  <rect x="68" y="58" width="4" height="4" fill="#ff4d4d"/>
  <rect x="72" y="62" width="4" height="4" fill="#ff4d4d"/>
  <rect x="76" y="58" width="4" height="4" fill="#ff4d4d"/>
  <rect x="80" y="54" width="4" height="4" fill="#ff4d4d"/>
  <rect x="76" y="62" width="4" height="4" fill="#ff4d4d"/>
  <rect x="64" y="66" width="4" height="4" fill="#ff4d4d"/>

  <!-- Connection line threat → center -->
  <rect x="88" y="76" width="4" height="4" fill="#ff4d4d" opacity="0.5"/>
  <rect x="100" y="88" width="4" height="4" fill="#ff4d4d" opacity="0.4"/>
  <rect x="112" y="100" width="4" height="4" fill="#ff4d4d" opacity="0.3"/>
  <rect x="124" y="112" width="4" height="4" fill="#ff4d4d" opacity="0.2"/>

  <!-- IAM user nodes (pixel people) -->
  <!-- User 1 -->
  <rect x="310" y="60" width="12" height="12" fill="#5aa7ff" opacity="0.8"/>
  <rect x="306" y="72" width="20" height="16" fill="#5aa7ff" opacity="0.6"/>
  <!-- User 2 -->
  <rect x="340" y="100" width="12" height="12" fill="#5aa7ff" opacity="0.8"/>
  <rect x="336" y="112" width="20" height="16" fill="#5aa7ff" opacity="0.6"/>
  <!-- User 3 (compromised - red) -->
  <rect x="310" y="140" width="12" height="12" fill="#ff4d4d" opacity="0.9"/>
  <rect x="306" y="152" width="20" height="16" fill="#ff4d4d" opacity="0.6"/>
  <!-- Lock icon on compromised user -->
  <rect x="312" y="170" width="8" height="6" fill="#ffb35c"/>
  <rect x="314" y="168" width="4" height="4" fill="none" stroke="#ffb35c" stroke-width="1"/>

  <!-- Response arrow (pixel) -->
  <rect x="248" y="128" width="8" height="4" fill="#4ecdc4"/>
  <rect x="256" y="124" width="8" height="4" fill="#4ecdc4"/>
  <rect x="264" y="120" width="8" height="4" fill="#4ecdc4"/>
  <rect x="272" y="116" width="8" height="4" fill="#4ecdc4"/>
  <rect x="280" y="112" width="8" height="4" fill="#4ecdc4"/>
  <rect x="288" y="108" width="8" height="4" fill="#4ecdc4"/>
  <!-- Arrowhead -->
  <rect x="296" y="104" width="8" height="4" fill="#4ecdc4"/>
  <rect x="292" y="100" width="4" height="4" fill="#4ecdc4"/>
  <rect x="292" y="108" width="4" height="4" fill="#4ecdc4"/>

  <!-- Labels -->
  <text x="12" y="220" font-family="monospace" font-size="11" fill="#5aa7ff" opacity="0.9">RADIUS</text>
  <text x="12" y="234" font-family="monospace" font-size="9" fill="#4ecdc4" opacity="0.7">IAM THREAT DETECTION</text>

  <!-- Metric chips -->
  <rect x="280" y="200" width="108" height="18" fill="#1a2744" stroke="#5aa7ff" stroke-width="1"/>
  <text x="286" y="213" font-family="monospace" font-size="9" fill="#5aa7ff">MTTD &lt;5s  MTTR ~30s</text>

  <!-- Scanline overlay -->
  <rect width="400" height="240" fill="url(#scan)" opacity="0.04"/>
  <defs>
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#fff"/>
    </pattern>
  </defs>
</svg>
