<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="400" height="240" fill="#0b1220"/>

  <!-- Grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#1a2744" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#1a2744" stroke-width="1"/>

  <!-- Firewall wall — left side (BEFORE: cracked) -->
  <!-- Wall bricks -->
  <rect x="30" y="40" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="70" y="40" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="20" y="56" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="60" y="56" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="30" y="72" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="70" y="72" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="20" y="88" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="60" y="88" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="30" y="104" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="70" y="104" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="20" y="120" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="60" y="120" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="30" y="136" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="70" y="136" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="20" y="152" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>
  <rect x="60" y="152" width="36" height="16" fill="#1a2744" stroke="#ffb35c" stroke-width="2"/>

  <!-- Crack / breach (red gap) -->
  <rect x="56" y="72" width="8" height="48" fill="#ff4d4d" opacity="0.7"/>
  <rect x="52" y="80" width="4" height="8" fill="#ff4d4d" opacity="0.5"/>
  <rect x="64" y="96" width="4" height="8" fill="#ff4d4d" opacity="0.5"/>
  <!-- Breach label -->
  <text x="22" y="186" font-family="monospace" font-size="7" fill="#ff4d4d">BREACH DETECTED</text>

  <!-- Arrow: before → after -->
  <rect x="116" y="108" width="8" height="4" fill="#4ecdc4"/>
  <rect x="124" y="104" width="8" height="4" fill="#4ecdc4"/>
  <rect x="132" y="100" width="8" height="4" fill="#4ecdc4"/>
  <rect x="140" y="96" width="8" height="4" fill="#4ecdc4"/>
  <!-- Arrowhead -->
  <rect x="148" y="92" width="8" height="4" fill="#4ecdc4"/>
  <rect x="144" y="88" width="4" height="4" fill="#4ecdc4"/>
  <rect x="144" y="96" width="4" height="4" fill="#4ecdc4"/>
  <!-- Lambda bolt above arrow -->
  <text x="122" y="90" font-family="monospace" font-size="8" fill="#4ecdc4">λ AUTO-HEAL</text>

  <!-- Firewall wall — right side (AFTER: restored) -->
  <rect x="230" y="40" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="270" y="40" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="220" y="56" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="260" y="56" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="230" y="72" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="270" y="72" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="220" y="88" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="260" y="88" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="230" y="104" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="270" y="104" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="220" y="120" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="260" y="120" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="230" y="136" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="270" y="136" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="220" y="152" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <rect x="260" y="152" width="36" height="16" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <!-- Restored label -->
  <text x="228" y="186" font-family="monospace" font-size="7" fill="#4ecdc4">RULES RESTORED</text>

  <!-- SNS notification bell (right) -->
  <rect x="330" y="50" width="40" height="50" fill="#0d1a2e" stroke="#ffb35c" stroke-width="2"/>
  <!-- Bell shape pixel -->
  <rect x="342" y="56" width="16" height="4" fill="#ffb35c"/>
  <rect x="338" y="60" width="24" height="4" fill="#ffb35c"/>
  <rect x="336" y="64" width="28" height="4" fill="#ffb35c"/>
  <rect x="336" y="68" width="28" height="4" fill="#ffb35c"/>
  <rect x="334" y="72" width="32" height="4" fill="#ffb35c"/>
  <rect x="334" y="76" width="32" height="4" fill="#ffb35c"/>
  <rect x="342" y="80" width="16" height="4" fill="#ffb35c"/>
  <!-- Bell dot -->
  <rect x="346" y="84" width="8" height="4" fill="#ffb35c"/>
  <!-- Notification rings -->
  <rect x="326" y="58" width="4" height="4" fill="#ffb35c" opacity="0.5"/>
  <rect x="322" y="54" width="4" height="4" fill="#ffb35c" opacity="0.3"/>
  <rect x="370" y="58" width="4" height="4" fill="#ffb35c" opacity="0.5"/>
  <rect x="374" y="54" width="4" height="4" fill="#ffb35c" opacity="0.3"/>
  <!-- SNS label -->
  <text x="334" y="114" font-family="monospace" font-size="7" fill="#ffb35c">SNS ALERT</text>

  <!-- CloudWatch metric bar chart -->
  <rect x="320" y="130" width="60" height="50" fill="#0d1a2e" stroke="#5aa7ff" stroke-width="1"/>
  <rect x="326" y="162" width="8" height="12" fill="#5aa7ff" opacity="0.5"/>
  <rect x="336" y="154" width="8" height="20" fill="#5aa7ff" opacity="0.7"/>
  <rect x="346" y="148" width="8" height="26" fill="#ff4d4d" opacity="0.8"/>
  <rect x="356" y="158" width="8" height="16" fill="#5aa7ff" opacity="0.5"/>
  <rect x="366" y="164" width="8" height="10" fill="#5aa7ff" opacity="0.4"/>
  <text x="322" y="192" font-family="monospace" font-size="6" fill="#5aa7ff">CLOUDWATCH</text>

  <!-- Labels -->
  <text x="12" y="220" font-family="monospace" font-size="11" fill="#ffb35c" opacity="0.9">SG REMEDIATION</text>
  <text x="12" y="234" font-family="monospace" font-size="9" fill="#4ecdc4" opacity="0.7">AUTO-HEALING SECURITY GROUPS</text>

  <!-- Metric chip -->
  <rect x="260" y="200" width="128" height="18" fill="#1a2744" stroke="#ffb35c" stroke-width="1"/>
  <text x="266" y="213" font-family="monospace" font-size="9" fill="#ffb35c">MTTD &lt;1s  MTTR ~4s  100%</text>

  <!-- Scanlines -->
  <rect width="400" height="240" fill="url(#scan3)" opacity="0.04"/>
  <defs>
    <pattern id="scan3" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#fff"/>
    </pattern>
  </defs>
</svg>
