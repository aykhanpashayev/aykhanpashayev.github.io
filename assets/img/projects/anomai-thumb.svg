<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="400" height="240" fill="#0b1220"/>

  <!-- Grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#1a2744" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#1a2744" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#1a2744" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#1a2744" stroke-width="1"/>

  <!-- Terminal window -->
  <rect x="20" y="30" width="200" height="160" fill="#0d1a2e" stroke="#4ecdc4" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="20" y="30" width="200" height="16" fill="#1a2744"/>
  <rect x="26" y="36" width="6" height="6" fill="#ff4d4d"/>
  <rect x="36" y="36" width="6" height="6" fill="#ffb35c"/>
  <rect x="46" y="36" width="6" height="6" fill="#4ecdc4"/>
  <text x="80" y="43" font-family="monospace" font-size="7" fill="#5aa7ff" opacity="0.8">anomai — detector</text>

  <!-- Terminal lines -->
  <text x="28" y="62" font-family="monospace" font-size="7" fill="#4ecdc4">$ analyzing cloudtrail...</text>
  <text x="28" y="74" font-family="monospace" font-size="7" fill="#888">  events loaded: 4,821</text>
  <text x="28" y="86" font-family="monospace" font-size="7" fill="#888">  running detectors [6]</text>
  <text x="28" y="98" font-family="monospace" font-size="7" fill="#ffb35c">  [!] unusual_hours    → ALERT</text>
  <text x="28" y="110" font-family="monospace" font-size="7" fill="#888">  [ ] new_principal    → ok</text>
  <text x="28" y="122" font-family="monospace" font-size="7" fill="#ff4d4d">  [!] permission_creep → ALERT</text>
  <text x="28" y="134" font-family="monospace" font-size="7" fill="#888">  [ ] api_velocity     → ok</text>
  <text x="28" y="146" font-family="monospace" font-size="7" fill="#ffb35c">  [!] geo_anomaly      → ALERT</text>
  <text x="28" y="158" font-family="monospace" font-size="7" fill="#888">  [ ] service_abuse    → ok</text>
  <text x="28" y="170" font-family="monospace" font-size="7" fill="#4ecdc4">  incidents: 3 surfaced</text>
  <!-- Cursor blink -->
  <rect x="28" y="178" width="6" height="8" fill="#4ecdc4" opacity="0.9"/>

  <!-- AI brain (pixel art) right side -->
  <!-- Brain outline -->
  <rect x="250" y="40" width="120" height="100" fill="#0d1a2e" stroke="#a78bfa" stroke-width="2"/>
  <!-- Brain pixel shape -->
  <rect x="266" y="52" width="12" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="48" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="294" y="48" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="310" y="52" width="12" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="262" y="60" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="56" width="32" height="8" fill="#a78bfa" opacity="0.5"/>
  <rect x="310" y="60" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="258" y="68" width="20" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="64" width="32" height="8" fill="#a78bfa" opacity="0.4"/>
  <rect x="310" y="68" width="20" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="258" y="76" width="20" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="72" width="32" height="8" fill="#a78bfa" opacity="0.4"/>
  <rect x="310" y="76" width="20" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="262" y="84" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="80" width="32" height="8" fill="#a78bfa" opacity="0.5"/>
  <rect x="310" y="84" width="16" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="266" y="92" width="12" height="8" fill="#a78bfa" opacity="0.7"/>
  <rect x="278" y="88" width="32" height="8" fill="#a78bfa" opacity="0.6"/>
  <rect x="310" y="92" width="12" height="8" fill="#a78bfa" opacity="0.7"/>
  <!-- Brain center divider -->
  <rect x="306" y="52" width="4" height="52" fill="#0d1a2e" opacity="0.6"/>
  <!-- Neural sparks -->
  <rect x="274" y="72" width="4" height="4" fill="#fff" opacity="0.8"/>
  <rect x="314" y="64" width="4" height="4" fill="#fff" opacity="0.8"/>
  <rect x="294" y="84" width="4" height="4" fill="#fff" opacity="0.6"/>

  <!-- LLM output bubble -->
  <rect x="250" y="152" width="120" height="36" fill="#1a2744" stroke="#a78bfa" stroke-width="1"/>
  <rect x="298" y="148" width="8" height="6" fill="#1a2744" stroke="#a78bfa" stroke-width="1"/>
  <text x="258" y="165" font-family="monospace" font-size="7" fill="#a78bfa">"Unusual login at 03:14</text>
  <text x="258" y="175" font-family="monospace" font-size="7" fill="#a78bfa"> from new IP — review"</text>

  <!-- Signal dots flowing terminal → brain -->
  <rect x="222" y="88" width="5" height="5" fill="#4ecdc4" opacity="0.9"/>
  <rect x="232" y="84" width="5" height="5" fill="#4ecdc4" opacity="0.7"/>
  <rect x="242" y="80" width="5" height="5" fill="#4ecdc4" opacity="0.5"/>

  <!-- Labels -->
  <text x="12" y="220" font-family="monospace" font-size="11" fill="#a78bfa" opacity="0.9">ANOMAI</text>
  <text x="12" y="234" font-family="monospace" font-size="9" fill="#4ecdc4" opacity="0.7">AI-POWERED IAM ANOMALY DETECTION</text>

  <!-- Metric chip -->
  <rect x="280" y="200" width="108" height="18" fill="#1a2744" stroke="#a78bfa" stroke-width="1"/>
  <text x="286" y="213" font-family="monospace" font-size="9" fill="#a78bfa">6 detectors  16 incidents</text>

  <!-- Scanlines -->
  <rect width="400" height="240" fill="url(#scan2)" opacity="0.04"/>
  <defs>
    <pattern id="scan2" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#fff"/>
    </pattern>
  </defs>
</svg>
